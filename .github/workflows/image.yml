# Build and push the PETGEM CI image as sha-<commit>. The job summary gives its
# reference. To adopt the image, write that reference to docker/ci-image.txt:
# the push runs every CI suite on the new image.
name: Build CI image

on:
  push:
    branches: [develop]
    paths:
      - 'docker/Dockerfile'
      - 'docker/requirements-ci.txt'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: echo "ghcr.io/${OWNER}/petgem-ci-env@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
