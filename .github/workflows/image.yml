# =============================================================================
# Build + push the PETGEM CI image (PETSc + mpicc + gmsh + python + h5py).
#
# Split out of ci-develop.yml so the image is rebuilt ONLY when the container
# definition changes (docker/**) or on manual dispatch - not on every push/PR.
# The correctness workflows (ci-develop.yml, tests-fm-csem.yml) merely *pull*
# the resulting :latest tag, which keeps normal CI runs fast and deterministic.
#
# NOTE: a change under docker/** triggers this build AND ci-develop.yml at the
# same time; that CI run pulls the *previous* image. Re-run CI after the image
# push completes if a run needs the freshly built image.
# =============================================================================
name: Build CI image

on:
  push:
    branches: [develop]
    paths: ['docker/**']
  workflow_dispatch:

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/dockerfile.develop
          push: true
          tags: ${{ env.DOCKER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
