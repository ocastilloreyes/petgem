# =========================================
# Workflow name displayed in GitHub Actions
# =========================================
name: PETGEM CI

# =================================
# Events that trigger this workflow
# =================================
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

# ===================================================
# Global environment variables accessible by all jobs
# ===================================================
env:
  PETSC_DIR: /usr/local/petsc
  PETSC_ARCH: arch-linux-c-opt
  # Pinned CI image. Built rarely by .github/workflows/image.yml (only when
  # docker/** changes); this workflow only *pulls* it - it never rebuilds the
  # image. Pin to a digest (...@sha256:...) instead of :latest for a fully
  # reproducible run.
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
  # Forces JS actions still declaring Node 20 (dorny/paths-filter@v3, no Node 24
  # release yet) to run on Node 24 - silences the deprecation warning until
  # upstream ships a v4. Remove once the action supports Node 24 natively.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ====
# Jobs
# ====
jobs:
  # ================================================================
  # Detect changes - gates the fm.csem jobs and the docs jobs
  # independently, so a docs-only change skips the kernel build/tests
  # and a code-only change skips the docs build.
  # ================================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      fmcsem: ${{ steps.filter.outputs.fmcsem }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fmcsem:
              - 'src/**'
              - 'include/**'
              - 'utils/**'
              - 'Makefile'
              - 'tests/**'
              - 'examples/**'
              - 'pytest.ini'
              - '.github/workflows/ci-develop.yml'
              - '.github/workflows/tests-fm-csem.yml'
            docs:
              - 'docs/**'
              - 'scripts/auto_doc/**'
              - 'Doxyfile'
              - 'include/**'
              - 'src/**'

  # ==============================
  # Compile fm.csem (forward kernel - the unit under test)
  # ==============================
  # Only fm.csem is built. The Extrae-instrumented build, the `petgem`
  # dispatcher and im.csem are out of scope for the forward-kernel regression
  # CI; e2e drives build/fm.csem directly.
  compile-fm-csem:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.fmcsem == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Pull CI image
        run: docker pull ${{ env.DOCKER_IMAGE }}

      - name: Compile fm.csem
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "make build/fm.csem"

      - name: Upload fm.csem binary
        uses: actions/upload-artifact@v4
        with:
          name: fm-csem-binary
          path: build/fm.csem

  # ==============================
  # FM-CSEM test suite (reusable)
  # ==============================
  # Levels 1-3 (basis / DOF ordering / element matrices, ALL orders 1..6) +
  # levels 4-5 (global assembly + basic physics on the unit cube, orders 1..3).
  # Delegated to tests-fm-csem.yml, which reuses this run's CI image and the
  # compiled fm.csem binary.
  tests-fm-csem:
    needs: [changes, compile-fm-csem]
    if: needs.changes.outputs.fmcsem == 'true'
    uses: ./.github/workflows/tests-fm-csem.yml
    with:
      docker_image: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
      binary_artifact: fm-csem-binary

  # =====================
  # Compile documentation
  # =====================
  compile-docs:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Pull CI image
        run: docker pull ${{ env.DOCKER_IMAGE }}
      - name: Generate documentation
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app -w /app \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "make docs"

  # =========================
  # Documentation drift guard
  # =========================
  # Fast comment/docstring synchronization check
  # (scripts/auto_doc/check_doc_drift.sh): a removed-symbol guard plus a
  # Doxygen @param-vs-signature check. Runs in the CI image (it has doxygen).
  doc-drift:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Pull CI image
        run: docker pull ${{ env.DOCKER_IMAGE }}
      - name: Check documentation drift
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app -w /app \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "bash scripts/auto_doc/check_doc_drift.sh"
