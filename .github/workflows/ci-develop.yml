# ========================
# Workflow name displayed in GitHub Actions
# ========================
name: PETGEM CI

# ========================
# Events that trigger this workflow
# ========================
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

# ========================
# Global environment variables accessible by all jobs
# ========================
env:
  PETSC_DIR: /usr/local/petsc
  PETSC_ARCH: arch-linux-c-opt
  GMSH_DIR: /usr/local/gmsh/bin
  EXTRAE_HOME: /usr/local/extrae
  PETGEM_CSEM_TEST_DIR: tests/csem_model
  EXTRAE_TEST_DIR: tests/extrae_profiling

# ========================
# Jobs
# ========================
jobs:
  # Job: Build Docker image
  docker-build:
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfile.develop
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
          load: true             # Load image locally to avoid pulls
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job: Compile PETGEM (matrix for USE_EXTRAE)
  compile-petgem:
    runs-on: ubuntu-latest
    needs: docker-build
    strategy:
      matrix:
        extrae: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      - name: Compile PETGEM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "make USE_EXTRAE=${{ matrix.extrae }}"

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.extrae == 0 && 'petgem-binaries-no-extrae' || 'petgem-binaries-extrae' }}
          path: ${{ matrix.extrae == 0 && 'build/csem_kernel' || 'build/csem_kernel_extrae' }}

  test-petgem:
    runs-on: ubuntu-latest
    needs: compile-petgem
    strategy:
      matrix:
        include:
          # PETGEM without extrae
          - type: normal
            nord: 1
            binary: petgem-binaries-no-extrae
            exe: csem_kernel
            compare: true
          - type: normal
            nord: 2
            binary: petgem-binaries-no-extrae
            exe: csem_kernel
            compare: true
          # PETGEM with Extrae
          - type: extrae
            nord: 1
            binary: petgem-binaries-extrae
            exe: csem_kernel_extrae
            compare: false

    steps:
      - uses: actions/checkout@v4

      # Download the corresponding binary
      - name: Download PETGEM binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: build

      - name: Make PETGEM binary executable
        run: chmod +x build/${{ matrix.exe }}

      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      - name: Preprocess data and run PETGEM
        run: |
          if [ "${{ matrix.type }}" = "normal" ]; then
            docker run --rm \
              -v ${{ github.workspace }}:/workspace \
              -w /workspace \
              ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
              bash -c "gmsh ${PETGEM_CSEM_TEST_DIR}/mesh_p${{ matrix.nord }}.geo -3 && \
                       python3 ${PETGEM_CSEM_TEST_DIR}/generate_resistivity_model.py ${{ matrix.nord }} && \
                       python3 ${PETGEM_CSEM_TEST_DIR}/generate_params_file.py ${{ matrix.nord }} && \
                       mpirun -n 4 build/${{ matrix.exe }} -options_file ${PETGEM_CSEM_TEST_DIR}/params_nord${{ matrix.nord }}.txt && \
                       python3 ${PETGEM_CSEM_TEST_DIR}/compare_responses.py ${{ matrix.nord }}"
          else
            docker run --rm \
              -e EXTRAE_HOME \
              -e EXTRAE_CONFIG_FILE=${EXTRAE_TEST_DIR}/extrae.xml \
              -e TRACE_NAME=petgem.prv \
              -e EXTRAE_LABELS=${EXTRAE_TEST_DIR}/petgem_labels.txt \
              -v ${{ github.workspace }}:/workspace \
              -w /workspace \
              ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
              bash -c "export LD_LIBRARY_PATH=\$EXTRAE_HOME/lib:\$LD_LIBRARY_PATH && \
                       gmsh ${EXTRAE_TEST_DIR}/mesh_p1.geo -3 && \
                       python3 ${EXTRAE_TEST_DIR}/generate_resistivity_model.py 1 && \
                       python3 ${EXTRAE_TEST_DIR}/generate_params_file.py 1 && \
                       mpirun -n 4 build/${{ matrix.exe }} -options_file ${EXTRAE_TEST_DIR}/params_nord1.txt && \
                       ${EXTRAE_HOME}/bin/mpi2prv -f ${EXTRAE_TEST_DIR}/TRACE.mpits -o ${EXTRAE_TEST_DIR}/${TRACE_NAME}"
          fi
  
  # Job: Generate documentation
  compile-docs:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      - name: Generate documentation
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "make docs"

  # Job: Publish CI report
  publish-report:
    runs-on: ubuntu-latest
    needs: [docker-build, compile-docs, compile-petgem, test-petgem]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare report folder
        run: mkdir -p ci-report

      - name: Copy PETGEM logo
        run: cp docs/source/_static/petgem_logo.png ci-report/

      - name: Generate CI HTML report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_RUN_ID=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs --jq '.workflow_runs[0].id')
          JOBS_JSON=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$WORKFLOW_RUN_ID/jobs)

          BRANCH=${GITHUB_REF##*/}
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_SHA=${GITHUB_SHA::7}

          echo "<html><head><title>PETGEM CI Report</title>
          <style>
            body { font-family: Arial; margin: 40px; background: #f9f9f9; color: #333; }
            h1 { color: #004080; display: flex; align-items: center; }
            h1 img { height: 50px; margin-right: 15px; }
            .meta { margin-bottom: 20px; font-size: 14px; color: #555; }
            table { border-collapse: collapse; width: 100%; background: #fff; }
            th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
            th { background-color: #004080; color: white; }
            tr:nth-child(even) { background-color: #f2f2f2; }
            a { color: #004080; text-decoration: none; font-weight: bold; }
            .success { color: green; font-weight: bold; }
            .failure { color: red; font-weight: bold; }
            .in_progress { color: orange; font-weight: bold; }
          </style>
          </head><body>" > ci-report/index.html

          echo "<h1><img src='petgem_logo.png' alt='PETGEM Logo'/> CI Report</h1>" >> ci-report/index.html
          echo "<div class='meta'>Branch: <b>$BRANCH</b> | Date: <b>$DATE</b> | Commit: <code>$COMMIT_SHA</code></div>" >> ci-report/index.html

          echo "<table><tr><th>Job</th><th>Status</th><th>Conclusion</th></tr>" >> ci-report/index.html
          echo "$JOBS_JSON" | jq -r '.jobs[] | 
            "<tr><td><a href=\"" + .html_url + "\">" + .name + "</a></td>
             <td>\(.status)</td>
             <td><span class=\"" + (.conclusion // "in_progress") + "\">" + (.conclusion // "in_progress") + "</span></td></tr>"' \
            >> ci-report/index.html
          echo "</table></body></html>" >> ci-report/index.html

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ci-report
          publish_branch: gh-pages
          user_name: github-actions
          user_email: github-actions@github.com
          keep_files: false

      - name: Print GitHub Pages URL
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          echo "CI report is available at:"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/index.html"
