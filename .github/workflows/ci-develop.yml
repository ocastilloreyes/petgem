# =========================================
# Workflow name displayed in GitHub Actions
# =========================================
name: PETGEM CI

# =================================
# Events that trigger this workflow
# =================================
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

# ===================================================
# Global environment variables accessible by all jobs
# ===================================================
env:
  PETSC_DIR: /usr/local/petsc
  PETSC_ARCH: arch-linux-c-opt
  GMSH_DIR: /usr/local/gmsh/bin
  EXTRAE_HOME: /usr/local/extrae
  CSEM_CASE_DIR: tests/cases/csem_model
  EXTRAE_CASE_DIR: tests/cases/csem_model/extrae
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
  # Forces JavaScript actions still declaring Node 20 (e.g.
  # dorny/paths-filter@v3, which has no Node 24 release yet) to run on
  # Node 24 — silences the Node 20 deprecation warning until upstream
  # ships a v4. Remove once all actions natively support Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ====
# Jobs
# ====
jobs:
  # ==================
  # Detect changes
  # ==================
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docs: ${{ steps.filter.outputs.docs }}
      pytest: ${{ steps.filter.outputs.pytest }}
      cases: ${{ steps.filter.outputs.cases }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'include/**'
              - 'utils/**'
              - 'Makefile'
            docs:
              - 'docs/**'
              - 'scripts/auto_doc/**'
              - 'Doxyfile'
            pytest:
              - 'tests/unit/**'
              - 'tests/integration/**'
              - 'tests/conftest.py'
              - 'pytest.ini'
            cases:
              - 'tests/cases/**'

  # ==================
  # Build docker image
  # ==================
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfile.develop
          push: true
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================
  # Compile PETGEM (Extrae matrix)
  # ==============================
  # NOTE: im.csem is intentionally not built/tested here yet — the
  # inverse-kernel CI lands in a follow-up.  We build the two targets
  # we exercise (fm.csem for forward, petgem as the unified dispatcher).
  compile-petgem:
    runs-on: ubuntu-latest
    needs: [docker-build, changes]
    if: needs.changes.outputs.src == 'true'
    strategy:
      matrix:
        extrae: [0, 1]
      fail-fast: true
    steps:
      - uses: actions/checkout@v5

      - name: Pull Docker image
        run: docker pull ${{ env.DOCKER_IMAGE }}

      - name: Compile PETGEM (fm.csem + petgem)
        run: |
          if [ "${{ matrix.extrae }}" = "1" ]; then
            FM_BIN=build/fm.csem.extrae
            PT_BIN=build/petgem.extrae
          else
            FM_BIN=build/fm.csem
            PT_BIN=build/petgem
          fi
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "make USE_EXTRAE=${{ matrix.extrae }} $FM_BIN $PT_BIN"

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.extrae == 0 && 'petgem-binaries-no-extrae' || 'petgem-binaries-extrae' }}
          path: |
            ${{ matrix.extrae == 0 && 'build/fm.csem' || 'build/fm.csem.extrae' }}
            ${{ matrix.extrae == 0 && 'build/petgem' || 'build/petgem.extrae' }}

  # ==========================
  # Python unit tests (pytest)
  # ==========================
  # No compiled kernel needed — exercises the utils/ python layer
  # (readBundle, readSigmaCSV, readSourcesText, …).
  test-unit:
    runs-on: ubuntu-latest
    needs: [docker-build, changes]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.pytest == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Pull Docker image
        run: docker pull ${{ env.DOCKER_IMAGE }}

      - name: Run pytest unit suite
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "pytest tests/unit -ra"

  # ============
  # PETGEM tests
  # ============
  # `normal` runs two things in sequence: the pytest integration suite
  # (primary — parametrized over nord, owns timeouts and reference
  # comparison) and a minimal inline shell pipeline (smoke — proves the
  # raw preprocess → mpirun → postprocess invocation still works without
  # the pytest harness in the middle).
  # `extrae` keeps the inline shell pipeline only; the pytest suite
  # doesn't model Extrae yet.
  test-petgem:
    runs-on: ubuntu-latest
    needs: [compile-petgem, changes]
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.pytest == 'true' ||
      needs.changes.outputs.cases == 'true'
    strategy:
      matrix:
        include:
          - type: normal
            nord: 1
            binary: petgem-binaries-no-extrae
            exe: fm.csem
          - type: extrae
            nord: 1
            binary: petgem-binaries-extrae
            exe: fm.csem.extrae
      max-parallel: 2
      fail-fast: true

    steps:
      - uses: actions/checkout@v5

      - name: Download PETGEM binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: build

      - name: Make PETGEM binaries executable
        run: chmod +x build/*

      - name: Pull Docker image
        run: docker pull ${{ env.DOCKER_IMAGE }}

      - name: Pytest integration suite (fm.csem)
        if: matrix.type == 'normal'
        run: |
          docker run --rm \
            -e PETGEM_FM_CSEM=/workspace/build/${{ matrix.exe }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "pytest tests/integration -m integration -ra -s"

      - name: Inline shell smoke (forward)
        if: matrix.type == 'normal'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "
              export CASE_DIR=${{ env.CSEM_CASE_DIR }} && \
              export NORD=${{ matrix.nord }} && \
              python3 utils/preprocess.py \
                -mode forward \
                -nord \${NORD} \
                -case_dir \${CASE_DIR} \
                -mesh_filename mesh_p\${NORD}.msh \
                -source_filename sources.txt \
                -receiver_filename receivers.txt \
                -sigma_file sigmas.csv \
                -input_filename input_p\${NORD}.h5 \
                -params_filename params_p\${NORD}.txt && \
              mpirun -n 4 build/${{ matrix.exe }} \
                -options_file \${CASE_DIR}/params_p\${NORD}.txt && \
              python3 \${CASE_DIR}/postprocess.py \
                -case_dir \${CASE_DIR} \
                -input_filename input_p\${NORD}.h5 \
                -responses_filename responses_p\${NORD}_src1.h5
            "

      - name: Inline shell pipeline (extrae)
        if: matrix.type == 'extrae'
        run: |
          docker run --rm \
            -e EXTRAE_HOME \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "
              export LD_LIBRARY_PATH=\$EXTRAE_HOME/lib:\$LD_LIBRARY_PATH && \
              export CASE_DIR=${{ env.CSEM_CASE_DIR }} && \
              export EXTRAE_DIR=${{ env.EXTRAE_CASE_DIR }} && \
              export EXTRAE_CONFIG_FILE=\${EXTRAE_DIR}/extrae.xml && \
              export TRACE_NAME=petgem.prv && \
              export EXTRAE_LABELS=\${EXTRAE_DIR}/petgem_labels.txt && \
              export NORD=${{ matrix.nord }} && \
              python3 utils/preprocess.py \
                -mode forward \
                -nord \${NORD} \
                -case_dir \${CASE_DIR} \
                -mesh_filename mesh_p\${NORD}.msh \
                -source_filename sources.txt \
                -receiver_filename receivers.txt \
                -sigma_file sigmas.csv \
                -input_filename input_p\${NORD}.h5 \
                -params_filename params_p\${NORD}.txt && \
              mpirun -n 4 build/${{ matrix.exe }} \
                -options_file \${CASE_DIR}/params_p\${NORD}.txt && \
              \${EXTRAE_HOME}/bin/mpi2prv \
                -f \${CASE_DIR}/TRACE.mpits \
                -o \${CASE_DIR}/\${TRACE_NAME}
            "

  # =====================
  # Compile documentation
  # =====================
  compile-docs:
    runs-on: ubuntu-latest
    needs: [docker-build, changes]
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Pull Docker image
        run: docker pull ${{ env.DOCKER_IMAGE }}
      - name: Generate documentation
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "make docs"

  # ========================
  # Publish CI report
  # ========================
  publish-report:
    runs-on: ubuntu-latest
    needs: [docker-build, compile-docs, compile-petgem, test-unit, test-petgem]
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      - name: Prepare report folder
        run: mkdir -pv ci-report

      - name: Copy PETGEM logo
        run: cp docs/source/_static/petgem_logo.png ci-report/

      - name: Generate CI HTML report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_RUN_ID=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs --jq '.workflow_runs[0].id')
          JOBS_JSON=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$WORKFLOW_RUN_ID/jobs)
          BRANCH=${GITHUB_REF##*/}
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_SHA=${GITHUB_SHA::7}

          cat <<EOF > ci-report/index.html
          <html>
          <head>
          <title>PETGEM CI Report</title>
          <style>
            body { font-family: Arial; margin: 40px; background: #f9f9f9; color: #333; }
            h1 { color: #004080; display: flex; align-items: center; }
            h1 img { height: 50px; margin-right: 15px; }
            .meta { margin-bottom: 20px; font-size: 14px; color: #555; }
            table { border-collapse: collapse; width: 100%; background: #fff; }
            th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
            th { background-color: #004080; color: white; }
            tr:nth-child(even) { background-color: #f2f2f2; }
            a { color: #004080; text-decoration: none; font-weight: bold; }
            .success { color: green; font-weight: bold; }
            .failure { color: red; font-weight: bold; }
            .in_progress { color: orange; font-weight: bold; }
            .notes { margin-top: 20px; font-size: 13px; color: #444; }
          </style>
          </head>
          <body>
          <h1><img src='petgem_logo.png' alt='PETGEM Logo'/> CI Report</h1>
          <div class='meta'>Branch: <b>$BRANCH</b> | Date: <b>$DATE</b> | Commit: <code>$COMMIT_SHA</code></div>
          <table>
          <tr><th>Job</th><th>Status</th><th>Conclusion</th></tr>
          EOF

          echo "$JOBS_JSON" | jq -r '.jobs[] | "<tr><td><a href=\"" + .html_url + "\">" + .name + "</a></td><td>\(.status)</td><td><span class=\"" + (.conclusion // "in_progress") + "\">" + (.conclusion // "in_progress") + "</span></td></tr>"' >> ci-report/index.html

          echo "</table>" >> ci-report/index.html

          # Add clarification notes
          cat <<EOF >> ci-report/index.html
          <div class="notes">
            <h3>Notes:</h3>
            <ul>
              <li><b>compile-petgem (0)</b> → builds <i>fm.csem</i> + <i>petgem</i> (no Extrae)</li>
              <li><b>compile-petgem (1)</b> → builds <i>fm.csem.extrae</i> + <i>petgem.extrae</i> (with Extrae)</li>
              <li><b>test-unit</b> → pytest tests/unit (no kernel required)</li>
              <li><b>test-petgem normal</b> → pytest integration suite (fm.csem, nord ∈ {1,2,3}) + inline shell smoke</li>
              <li><b>test-petgem extrae</b> → inline shell pipeline with Extrae profiling</li>
              <li><b>im.csem</b> → not built/tested in CI yet (follow-up)</li>
            </ul>
          </div>
          </body></html>
          EOF


      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ci-report
          publish_branch: gh-pages
          user_name: github-actions
          user_email: github-actions@github.com
          keep_files: false

      - name: Print GitHub Pages URL
        run: |
          REPO_NAME=$(basename "$GITHUB_REPOSITORY")
          echo "CI report is available at:"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/index.html"
