# =========================================
# Workflow name displayed in GitHub Actions
# =========================================
name: PETGEM CI

# =================================
# Events that trigger this workflow
# =================================
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

# ===========
# Run control
# ===========
# A new run on the same ref cancels the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ===================================================
# Global environment variables accessible by all jobs
# ===================================================
env:
  PETSC_DIR: /usr/local/petsc
  PETSC_ARCH: arch-linux-c-opt
  # CI image, built by .github/workflows/image.yml when docker/** changes.
  # This workflow only pulls it.
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
  # Forces JS actions still declaring Node 20 (dorny/paths-filter@v3, no Node 24
  # release yet) to run on Node 24 - silences the deprecation warning until
  # upstream ships a v4. Remove once the action supports Node 24 natively.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ====
# Jobs
# ====
jobs:
  # ================================================================
  # Detect changes - gates the kernel jobs and the docs jobs
  # independently, so a docs-only change skips the kernel build/tests
  # and a code-only change skips the docs build.
  # ================================================================
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fmcsem: ${{ steps.filter.outputs.fmcsem }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fmcsem:
              - 'src/**'
              - 'include/**'
              - 'utils/**'
              - 'Makefile'
              - 'tests/**'
              - 'examples/**'
              - 'pytest.ini'
              - 'scripts/ci/**'
              - '.github/workflows/ci-develop.yml'
              - '.github/workflows/tests-fm-csem.yml'
              - '.github/workflows/tests-fm-mt.yml'
              - '.github/workflows/tests-im-csem.yml'
              - '.github/workflows/tests-fm-tdcsem.yml'
            docs:
              - 'docs/**'
              - 'scripts/auto_doc/**'
              - 'scripts/ci/**'
              - 'Doxyfile'
              - 'include/**'
              - 'src/**'

  # ==============================
  # Compile every binary used by the test suites
  # ==============================
  compile-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.fmcsem == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Pull CI image
        run: bash scripts/ci/pull_image.sh "${{ env.DOCKER_IMAGE }}"

      - name: Compile fm.csem, im.csem, fm.mt, fm.tdcsem, petgem and the MMS program
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "make -j2 all mms"

      - name: Upload kernel binaries
        uses: actions/upload-artifact@v4
        with:
          name: kernel-binaries
          path: |
            build/fm.csem
            build/im.csem
            build/fm.mt
            build/fm.tdcsem
            build/mms

  # ==============================
  # FM-CSEM test suite (reusable)
  # ==============================
  # C harnesses (all orders), levels 4-5 on the unit cube and level 6 (MMS).
  tests-fm-csem:
    needs: [changes, compile-kernels]
    if: needs.changes.outputs.fmcsem == 'true'
    uses: ./.github/workflows/tests-fm-csem.yml
    with:
      docker_image: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
      binary_artifact: kernel-binaries

  # ==============================
  # FM-MT test suite (reusable)
  # ==============================
  # MT half-space end-to-end check (tests/mt) on the compiled fm.mt binary.
  # The MT C harnesses (tests/unit) run in the fe-core job of tests-fm-csem.yml.
  tests-fm-mt:
    needs: [changes, compile-kernels]
    if: needs.changes.outputs.fmcsem == 'true'
    uses: ./.github/workflows/tests-fm-mt.yml
    with:
      docker_image: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
      binary_artifact: kernel-binaries

  # ==============================
  # IM-CSEM test suite (reusable)
  # ==============================
  # Reduced im_csem_block inversion (tests/im) on the compiled binaries.
  tests-im-csem:
    needs: [changes, compile-kernels]
    if: needs.changes.outputs.fmcsem == 'true'
    uses: ./.github/workflows/tests-im-csem.yml
    with:
      docker_image: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
      binary_artifact: kernel-binaries

  # ================================
  # FM-TDCSEM test suite (reusable)
  # ================================
  # Time-domain CSEM half-space check (tests/tdcsem) on the compiled fm.tdcsem binary.
  tests-fm-tdcsem:
    needs: [changes, compile-kernels]
    if: needs.changes.outputs.fmcsem == 'true'
    uses: ./.github/workflows/tests-fm-tdcsem.yml
    with:
      docker_image: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
      binary_artifact: kernel-binaries

  # =====================
  # Compile documentation
  # =====================
  compile-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Pull CI image
        run: bash scripts/ci/pull_image.sh "${{ env.DOCKER_IMAGE }}"
      - name: Generate documentation
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app -w /app \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "make docs"

  # =========================
  # Documentation drift guard
  # =========================
  # Fast comment/docstring synchronization check
  # (scripts/auto_doc/check_doc_drift.sh): a removed-symbol guard plus a
  # Doxygen @param-vs-signature check. Runs in the CI image (it has doxygen).
  doc-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Pull CI image
        run: bash scripts/ci/pull_image.sh "${{ env.DOCKER_IMAGE }}"
      - name: Check documentation drift
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app -w /app \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "bash scripts/auto_doc/check_doc_drift.sh"
