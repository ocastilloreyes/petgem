# ========================
# Workflow name displayed in GitHub Actions
# ========================
name: PETGEM CI

# ========================
# Events that trigger this workflow
# ========================
on:
  push:
    branches:
      - develop  # Trigger CI on pushes to 'develop' branch
  pull_request:
    branches:
      - develop  # Trigger CI on PRs targeting 'develop'

# ========================
# Global environment variables accessible by all jobs
# ========================
env:
  PETSC_DIR: /usr/local/petsc             # PETSc installation directory
  PETSC_ARCH: arch-linux-c-opt            # PETSc architecture/config
  GMSH_DIR: /usr/local/gmsh/bin           # GMSH executable directory
  PETGEM_TEST_DIR: tests/canonical_model  # Directory with PETGEM test models

# ========================
# Docker-build
# ========================
jobs:
  # Job: docker-build
  docker-build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup QEMU for cross-platform Docker builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Setup Docker Buildx for advanced caching and multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker image and push to GHCR
      - name: Build Docker image and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfile.develop
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job: Compile the PETGEM code using the Docker image
  compile-src:
    runs-on: ubuntu-latest
    needs: docker-build  # Wait for Docker image build to complete
    steps:
      - uses: actions/checkout@v4

      # Pull the CI Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      # Compile PETGEM inside Docker and capture log
      - name: Compile PETGEM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            make USE_EXTRAE=0 

  # Job: Generate project documentation and badge inside Docker
  compile-docs:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      # Pull Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      # Generate docs and coverage badge
      - name: Generate documentation and badge
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "make docs"
 
  # Job: run PETGEM test preprocessing scripts inside Docker
  test-csem-kernel:
    runs-on: ubuntu-latest
    needs: compile-src
    steps:
      - uses: actions/checkout@v4

      # Pull Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      # Run test preprocessing and capture log
      - name: Run PETGEM tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "gmsh ${PETGEM_TEST_DIR}/mesh.geo -3 && \
                     python3 ${PETGEM_TEST_DIR}/generate_resistivity_model.py && \
                     python3 ${PETGEM_TEST_DIR}/generate_params_file.py"

  # Job: publish CI report
  publish-report:
    runs-on: ubuntu-latest
    needs: [docker-build, compile-src, compile-docs, test-csem-kernel]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare report folder
        run: mkdir -p ci-report

      - name: Generate CI report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_RUN_ID=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs --jq '.workflow_runs[0].id')
          JOBS_JSON=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$WORKFLOW_RUN_ID/jobs)
          echo "<html><head><title>PETGEM CI Report</title></head><body>" > ci-report/index.html
          echo "<h1>PETGEM CI Report</h1><ul>" >> ci-report/index.html
          echo "$JOBS_JSON" | jq -r '.jobs[] | "<li>\(.name): \(.status) / \(.conclusion)</li>"' >> ci-report/index.html
          echo "</ul></body></html>" >> ci-report/index.html

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ci-report
          publish_branch: gh-pages
          user_name: github-actions
          user_email: github-actions@github.com
          keep_files: false

      - name: Print GitHub Pages URL
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          echo "CI report is available at:"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/index.html"