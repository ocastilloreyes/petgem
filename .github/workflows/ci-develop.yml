# ========================
# Workflow name displayed in GitHub Actions
# ========================
name: PETGEM CI

# ========================
# Events that trigger this workflow
# ========================
on:
  push:
    branches:
      - develop  # Trigger CI on pushes to 'develop' branch
  pull_request:
    branches:
      - develop  # Trigger CI on PRs targeting 'develop'

# ========================
# Global environment variables accessible by all jobs
# ========================
env:
  PETSC_DIR: /usr/local/petsc             # PETSc installation directory
  PETSC_ARCH: arch-linux-c-opt            # PETSc architecture/config
  GMSH_DIR: /usr/local/gmsh/bin           # GMSH executable directory
  PETGEM_TEST_DIR: tests/canonical_model  # Directory with PETGEM test models

# ========================
# Docker-build
# ========================
jobs:
  # Job: docker-build
  docker-build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup QEMU for cross-platform Docker builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Setup Docker Buildx for advanced caching and multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker image and push to GHCR
      - name: Build Docker image and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfile.develop
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job: Compile the PETGEM code using the Docker image
  compile-src:
    runs-on: ubuntu-latest
    needs: docker-build  # Wait for Docker image build to complete
    steps:
      - uses: actions/checkout@v4

      # Pull the CI Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      # Compile PETGEM inside Docker and capture log
      - name: Compile PETGEM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            make USE_EXTRAE=0 

  # Job: Generate project documentation and badge inside Docker
  compile-docs:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      # Pull Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      # Generate docs and coverage badge
      - name: Generate documentation and badge
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "make docs"
 
  # Job: run PETGEM test preprocessing scripts inside Docker
  test-csem-kernel:
    runs-on: ubuntu-latest
    needs: compile-src
    steps:
      - uses: actions/checkout@v4

      # Pull Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      # Run test preprocessing and capture log
      - name: Run preprocessing data
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "gmsh ${PETGEM_TEST_DIR}/mesh.geo -3 && \
                     python3 ${PETGEM_TEST_DIR}/generate_resistivity_model.py && \
                     python3 ${PETGEM_TEST_DIR}/generate_params_file.py"

      - name: Run PETGEM p=1 examples to verify correct installation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "mpirun -n 1 build/./csem-kernel -options_file ${PETGEM_TEST_DIR}/params_nord1.txt && \
                     mpirun -n 2 build/./csem-kernel -options_file ${PETGEM_TEST_DIR}/params_nord1.txt"

      - name: Run PETGEM p=2 examples to verify correct installation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "mpirun -n 1 build/./csem-kernel -options_file ${PETGEM_TEST_DIR}/params_nord2.txt && \
                     mpirun -n 2 build/./csem-kernel -options_file ${PETGEM_TEST_DIR}/params_nord2.txt "

  # Job: publish CI report
  publish-report:
    runs-on: ubuntu-latest
    needs: [docker-build, compile-src, compile-docs, test-csem-kernel]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare report folder
        run: mkdir -p ci-report

      - name: Copy PETGEM logo to report folder
        run: cp docs/source/_static/petgem_logo.png ci-report/

      - name: Generate CI report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_RUN_ID=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs --jq '.workflow_runs[0].id')
          JOBS_JSON=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$WORKFLOW_RUN_ID/jobs)

          BRANCH=${GITHUB_REF##*/}
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_SHA=${GITHUB_SHA::7}

          echo "<html><head><title>PETGEM CI Report</title>
          <style>
            body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; color: #333; }
            h1 { color: #004080; display: flex; align-items: center; }
            h1 img { height: 50px; margin-right: 15px; }
            .meta { margin-bottom: 20px; font-size: 14px; color: #555; }
            table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
            th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
            th { background-color: #004080; color: white; }
            tr:nth-child(even) { background-color: #f2f2f2; }
            a { color: #004080; text-decoration: none; font-weight: bold; }
            a:hover { text-decoration: underline; }
            .success { color: green; font-weight: bold; }
            .failure { color: red; font-weight: bold; }
            .in_progress { color: orange; font-weight: bold; }
          </style>
          </head><body>" > ci-report/index.html

          echo "<h1><img src='petgem_logo.png' alt='PETGEM Logo'/> CI Report</h1>" >> ci-report/index.html
          echo "<div class='meta'>Branch: <b>$BRANCH</b> | Date: <b>$DATE</b> | Commit: <code>$COMMIT_SHA</code></div>" >> ci-report/index.html

          echo "<table><tr><th>Job</th><th>Status</th><th>Conclusion</th></tr>" >> ci-report/index.html
          echo "$JOBS_JSON" | jq -r '.jobs[] | 
            "<tr><td><a href=\"" + .html_url + "\">" + .name + "</a></td>
             <td>\(.status)</td>
             <td><span class=\"" + (.conclusion // "in_progress") + "\">" + (.conclusion // "in_progress") + "</span></td></tr>"' \
            >> ci-report/index.html
          echo "</table></body></html>" >> ci-report/index.html

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ci-report
          publish_branch: gh-pages
          user_name: github-actions
          user_email: github-actions@github.com
          keep_files: false

      - name: Print GitHub Pages URL
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          echo "CI report is available at:"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/index.html"