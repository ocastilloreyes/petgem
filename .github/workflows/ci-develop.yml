# =========================================
# Workflow name displayed in GitHub Actions
# =========================================
name: PETGEM CI

# =================================
# Events that trigger this workflow
# =================================
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

# ===================================================
# Global environment variables accessible by all jobs
# ===================================================
env:
  PETSC_DIR: /usr/local/petsc
  PETSC_ARCH: arch-linux-c-opt
  GMSH_DIR: /usr/local/gmsh/bin
  EXTRAE_HOME: /usr/local/extrae
  CSEM_TEST_DIR: tests/csem_model
  EXTRAE_TEST_DIR: tests/extrae_profiling
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

# ====
# Jobs
# ====
jobs:
  # ==================
  # Detect changes
  # ==================
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docs: ${{ steps.filter.outputs.docs }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'include/**'
              - 'Makefile'
            docs:
              - 'docs/**'
              - 'scripts/auto_doc/**'
              - 'Doxyfile'
            tests:
              - 'tests/**'

  # ==================
  # Build docker image
  # ==================
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerfile.develop
          push: true
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================
  # Compile PETGEM (Extrae matrix)
  # ==============================
  compile-petgem:
    runs-on: ubuntu-latest
    needs: [docker-build, changes]
    if: needs.changes.outputs.src == 'true'
    strategy:
      matrix:
        extrae: [0, 1]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Pull Docker image
        run: docker pull ${{ env.DOCKER_IMAGE }}
      
      - name: Compile PETGEM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "make USE_EXTRAE=${{ matrix.extrae }}"
      
      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.extrae == 0 && 'petgem-binaries-no-extrae' || 'petgem-binaries-extrae' }}
          path: ${{ matrix.extrae == 0 && 'build/fm.csem' || 'build/fm.csem.extrae' }}

  # ============
  # PETGEM tests
  # ============
  test-petgem:
    runs-on: ubuntu-latest
    needs: [compile-petgem, changes]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.tests == 'true'
    strategy:
      matrix:
        include:
          - type: normal
            nord: 1
            binary: petgem-binaries-no-extrae
            exe: fm.csem
            compare: true
          #- type: normal
          #  nord: 2
          #  binary: petgem-binaries-no-extrae
          #  exe: csem_kernel
          #  compare: true
          - type: extrae
            nord: 1
            binary: petgem-binaries-extrae
            exe: fm.csem.extrae
            compare: false
      max-parallel: 2
      fail-fast: true
    
    steps:
      - uses: actions/checkout@v4

      - name: Download PETGEM binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: build

      - name: Make PETGEM binary executable
        run: chmod +x build/${{ matrix.exe }}

      - name: Pull Docker image
        run: docker pull ${{ env.DOCKER_IMAGE }}

      - name: Preprocess data and run PETGEM
        run: |
          case "${{ matrix.type }}" in
            normal)
              docker run --rm \
                -v ${{ github.workspace }}:/workspace \
                -w /workspace \
                ${{ env.DOCKER_IMAGE }} \
                bash -c "
                  export CSEM_TEST_DIR=tests/csem_model && \
                  export NORD=${{ matrix.nord }} && \
                  gmsh \${CSEM_TEST_DIR}/mesh_p\${NORD}.geo -3 && \
                  python3 \${CSEM_TEST_DIR}/generate_input.py \
                    -nord \${NORD} \
                    -case_dir \${CSEM_TEST_DIR} \
                    -mesh_filename mesh_p\${NORD}.msh \
                    -source_filename sources.txt \
                    -receiver_filename receivers.txt && \
                  mpirun -n 4 build/${{ matrix.exe }} \
                    -options_file \${CSEM_TEST_DIR}/params_nord\${NORD}.txt && \
                  python3 \${CSEM_TEST_DIR}/compare_responses.py \${NORD}
                "
              ;;
            extrae)
              docker run --rm \
                -e EXTRAE_HOME \
                -v ${{ github.workspace }}:/workspace \
                -w /workspace \
                ${{ env.DOCKER_IMAGE }} \
                bash -c "
                  export LD_LIBRARY_PATH=\$EXTRAE_HOME/lib:\$LD_LIBRARY_PATH && \
                  export EXTRAE_TEST_DIR=tests/extrae_profiling && \
                  export EXTRAE_CONFIG_FILE=\${EXTRAE_TEST_DIR}/extrae.xml && \
                  export TRACE_NAME=petgem.prv && \
                  export EXTRAE_LABELS=\${EXTRAE_TEST_DIR}/petgem_labels.txt && \
                  export NORD=${{ matrix.nord }} && \
                  gmsh \${EXTRAE_TEST_DIR}/mesh_p\${NORD}.geo -3 && \
                  python3 \${EXTRAE_TEST_DIR}/generate_input.py \
                    -nord \${NORD} \
                    -case_dir \${EXTRAE_TEST_DIR} \
                    -mesh_filename mesh_p\${NORD}.msh \
                    -source_filename sources.txt \
                    -receiver_filename receivers.txt && \
                  mpirun -n 4 build/${{ matrix.exe }} \
                    -options_file \${EXTRAE_TEST_DIR}/params_nord\${NORD}.txt && \
                  \${EXTRAE_HOME}/bin/mpi2prv \
                    -f \${EXTRAE_TEST_DIR}/TRACE.mpits \
                    -o \${EXTRAE_TEST_DIR}/\${TRACE_NAME}
                "
              ;;
          esac

  # =====================
  # Compile documentation
  # =====================
  compile-docs:
    runs-on: ubuntu-latest
    needs: [docker-build, changes]
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Pull Docker image
        run: docker pull ${{ env.DOCKER_IMAGE }}
      - name: Generate documentation
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            ${{ env.DOCKER_IMAGE }} \
            bash -c "make docs"

  # ========================
  # Publish CI report
  # ========================
  publish-report:
    runs-on: ubuntu-latest
    needs: [docker-build, compile-docs, compile-petgem, test-petgem]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      - name: Prepare report folder
        run: mkdir -pv ci-report

      - name: Copy PETGEM logo
        run: cp docs/source/_static/petgem_logo.png ci-report/

      - name: Generate CI HTML report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_RUN_ID=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs --jq '.workflow_runs[0].id')
          JOBS_JSON=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$WORKFLOW_RUN_ID/jobs)
          BRANCH=${GITHUB_REF##*/}
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_SHA=${GITHUB_SHA::7}

          cat <<EOF > ci-report/index.html
          <html>
          <head>
          <title>PETGEM CI Report</title>
          <style>
            body { font-family: Arial; margin: 40px; background: #f9f9f9; color: #333; }
            h1 { color: #004080; display: flex; align-items: center; }
            h1 img { height: 50px; margin-right: 15px; }
            .meta { margin-bottom: 20px; font-size: 14px; color: #555; }
            table { border-collapse: collapse; width: 100%; background: #fff; }
            th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
            th { background-color: #004080; color: white; }
            tr:nth-child(even) { background-color: #f2f2f2; }
            a { color: #004080; text-decoration: none; font-weight: bold; }
            .success { color: green; font-weight: bold; }
            .failure { color: red; font-weight: bold; }
            .in_progress { color: orange; font-weight: bold; }
            .notes { margin-top: 20px; font-size: 13px; color: #444; }
          </style>
          </head>
          <body>
          <h1><img src='petgem_logo.png' alt='PETGEM Logo'/> CI Report</h1>
          <div class='meta'>Branch: <b>$BRANCH</b> | Date: <b>$DATE</b> | Commit: <code>$COMMIT_SHA</code></div>
          <table>
          <tr><th>Job</th><th>Status</th><th>Conclusion</th></tr>
          EOF

          echo "$JOBS_JSON" | jq -r '.jobs[] | "<tr><td><a href=\"" + .html_url + "\">" + .name + "</a></td><td>\(.status)</td><td><span class=\"" + (.conclusion // "in_progress") + "\">" + (.conclusion // "in_progress") + "</span></td></tr>"' >> ci-report/index.html

          echo "</table>" >> ci-report/index.html

          # Add clarification notes
          cat <<EOF >> ci-report/index.html
          <div class="notes">
            <h3>Notes:</h3>
            <ul>
              <li><b>compile-petgem (0)</b> → PETGEM compiled <i>without Extrae</i></li>
              <li><b>compile-petgem (1)</b> → PETGEM compiled <i>with Extrae</i></li>
              <li><b>normal</b> → run <i>without Extrae</i></li>
              <li><b>extrae</b> → run <i>with Extrae</i></li>
              <li><b>true</b> → run test comparison enabled</li>
            </ul>
          </div>
          </body></html>
          EOF


      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ci-report
          publish_branch: gh-pages
          user_name: github-actions
          user_email: github-actions@github.com
          keep_files: false

      - name: Print GitHub Pages URL
        run: |
          REPO_NAME=$(basename "$GITHUB_REPOSITORY")
          echo "CI report is available at:"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/index.html"
