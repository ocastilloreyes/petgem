# =============================================================================
# FM-CSEM test suite. See tests/README.md.
#
# Reusable workflow called by ci-develop.yml with the CI image and the compiled
# binaries; the C harnesses need only the image.
#
#   fe-core-tests : C harnesses (tests/unit), all orders 1..6
#   e2e-tests     : levels 4-5, fm.csem on the unit cube, 2 MPI tasks
#   mms-tests     : level 6, build/mms vs golden errors, 2 MPI tasks
# =============================================================================
name: FM-CSEM tests

on:
  workflow_call:
    inputs:
      docker_image:
        description: CI image (PETSc + mpicc + gmsh + python + h5py).
        required: true
        type: string
      binary_artifact:
        description: Artifact holding build/fm.csem.
        required: false
        type: string
        default: kernel-binaries
  workflow_dispatch:
    inputs:
      docker_image:
        description: CI image (leave blank to use the default GHCR tag).
        required: false
        default: ""

env:
  PETSC_DIR: /usr/local/petsc
  PETSC_ARCH: arch-linux-c-opt

jobs:
  fe-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve CI image
        id: img
        run: echo "image=${{ inputs.docker_image != '' && inputs.docker_image || format('ghcr.io/{0}/petgem-ci-env:latest', github.repository_owner) }}" >> "$GITHUB_OUTPUT"
      - name: Pull CI image
        run: docker pull ${{ steps.img.outputs.image }}
      - name: C harnesses (all orders 1..6)
        run: |
          docker run --rm -e PETSC_DIR -e PETSC_ARCH \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ${{ steps.img.outputs.image }} bash -c "pytest tests/unit -ra"

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download fm.csem
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binary_artifact }}
          path: build
      - name: Make binary executable
        run: chmod +x build/fm.csem
      - name: Resolve CI image
        id: img
        run: echo "image=${{ inputs.docker_image != '' && inputs.docker_image || format('ghcr.io/{0}/petgem-ci-env:latest', github.repository_owner) }}" >> "$GITHUB_OUTPUT"
      - name: Pull CI image
        run: docker pull ${{ steps.img.outputs.image }}
      - name: Preprocess fm_csem_unit_cube bundle (gmsh -> outputs/input.h5)
        run: |
          docker run --rm -e PETSC_DIR -e PETSC_ARCH \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ${{ steps.img.outputs.image }} bash -c "bash examples/fm_csem_unit_cube/scripts/build_bundles.sh"
      - name: Levels 4-5 (orders 1..3, 2 MPI tasks)
        run: |
          docker run --rm \
            -e PETGEM_FM_CSEM=/workspace/build/fm.csem -e PETGEM_NP=2 \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ${{ steps.img.outputs.image }} bash -c "pytest tests/e2e -ra"

  mms-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binary_artifact }}
          path: build
      - name: Make binary executable
        run: chmod +x build/mms
      - name: Resolve CI image
        id: img
        run: echo "image=${{ inputs.docker_image != '' && inputs.docker_image || format('ghcr.io/{0}/petgem-ci-env:latest', github.repository_owner) }}" >> "$GITHUB_OUTPUT"
      - name: Pull CI image
        run: docker pull ${{ steps.img.outputs.image }}
      - name: Build the N=4 MMS bundle (gmsh -> preprocess -> tests/mms/input.h5)
        run: |
          docker run --rm -e PETSC_DIR -e PETSC_ARCH \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ${{ steps.img.outputs.image }} bash -c "bash tests/mms/build_bundle.sh 4"
      - name: Level 6 (orders 1/3/6, 2 MPI tasks) vs golden
        run: |
          docker run --rm \
            -e PETGEM_MMS=/workspace/build/mms -e PETGEM_NP=2 \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ${{ steps.img.outputs.image }} bash -c "pytest tests/mms -ra"
