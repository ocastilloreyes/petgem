# =============================================================================
# FM-TDCSEM test suite. See tests/README.md.
#
# Reusable workflow: called by ci-develop.yml after the fm.tdcsem binary is
# compiled, so it never rebuilds the image or the kernel - it consumes them.
#
#   tdcsem-tests : time-domain CSEM half-space end-to-end check - fm.tdcsem on a
#                  10 ohm-m half-space under air with a step-on x-dipole
#                  (tests/tdcsem), direct LU (MUMPS): Ex and dBy/dt at order 2
#                  against empymod, rank-invariant result at order 1 on 1 and 3
#                  MPI tasks. Needs the binary + gmsh (in the image).
# =============================================================================
name: FM-TDCSEM tests

on:
  workflow_call:
    inputs:
      docker_image:
        description: CI image (PETSc + mpicc + gmsh + python + h5py).
        required: true
        type: string
      binary_artifact:
        description: Artifact holding build/fm.tdcsem.
        required: false
        type: string
        default: kernel-binaries
  workflow_dispatch:
    inputs:
      docker_image:
        description: CI image (leave blank to use the default GHCR tag).
        required: false
        default: ""

env:
  PETSC_DIR: /usr/local/petsc
  PETSC_ARCH: arch-linux-c-opt

jobs:
  tdcsem-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download fm.tdcsem
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binary_artifact }}
          path: build
      - name: Make binary executable
        run: chmod +x build/fm.tdcsem
      - name: Resolve CI image
        id: img
        run: echo "image=${{ inputs.docker_image != '' && inputs.docker_image || format('ghcr.io/{0}/petgem-ci-env:latest', github.repository_owner) }}" >> "$GITHUB_OUTPUT"
      - name: Pull CI image
        run: docker pull ${{ steps.img.outputs.image }}
      - name: Build the TD-CSEM half-space bundle (gmsh -> preprocess -mode fm.tdcsem -> tests/tdcsem/input.h5)
        run: |
          docker run --rm -e PETSC_DIR -e PETSC_ARCH \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ${{ steps.img.outputs.image }} bash -c "bash tests/tdcsem/build_bundle.sh"
      - name: TD-CSEM half-space (order 2 vs empymod; order 1 on 1 and 3 MPI tasks)
        run: |
          docker run --rm \
            -e PETGEM_FM_TDCSEM=/workspace/build/fm.tdcsem \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            ${{ steps.img.outputs.image }} bash -c "pytest tests/tdcsem -ra"
