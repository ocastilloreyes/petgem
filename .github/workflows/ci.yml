name: PETGEM CI with docker cache

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build_test_and_report:
    runs-on: ubuntu-latest

    steps:
      # === Step 1: SETUP & BUILD ===
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image and load to local Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: petgem-ci-env:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # === Step 2: INITIALIZE REPORT ===
      - name: Initialize CI report
        run: |
          echo "# PETGEM CI/CD Execution Report" > ci_summary_report.md
          echo "" >> ci_summary_report.md
          echo "## Run Details" >> ci_summary_report.md
          echo "- **Trigger:** ${{ github.event_name }}" >> ci_summary_report.md
          echo "- **Commit:** \`${{ github.sha }}\`" >> ci_summary_report.md
          echo "- **Timestamp:** $(date -u)" >> ci_summary_report.md
          echo "" >> ci_summary_report.md
          echo "## Pipeline Status" >> ci_summary_report.md

      # === Step 3: COMPILE PETGEM ===
      - name: Compile PETGEM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e PETSC_DIR=/usr/local/petsc \
            -e PETSC_ARCH=arch-linux-c-opt \
            petgem-ci-env:latest \
            make USE_EXTRAE=0

      # === Step 5: DOCUMENTATION & BADGE ===
      - name: Generate documentation
        run: |
          docker run --rm \
          --workdir /app \
          -v "${{ github.workspace }}":/app \
          petgem-ci-env:latest \
          make docs
          python3 ./scripts/coverage_doc/coverage_doc.py ./docs/doxygen/xml/ --badge --badge_path ./build/doc_coverage_badge.svg
          DOC_COVERAGE=$(python3 ./scripts/coverage_doc/coverage_doc.py ./docs/doxygen/xml/ | grep "Documentation Coverage:" | awk '{print $3}')
          echo "✅ **Documentation:** Generated (Coverage: ${DOC_COVERAGE})" >> ci_summary_report.md

      - name: Prepare badge for GitHub pages deployment
        run: |
          mkdir -p ./public
          mv ./build/doc_coverage_badge.svg ./public/

      - name: Deploy documentation badge to GitHub pages
          uses: peaceiris/actions-gh-pages@v3
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_branch: gh-pages
            publish_dir: ./public
            keep_files: true
            cname: ''
            user_name: 'github-actions[bot]'
            user_email: 'github-actions[bot]@users.noreply.github.com'
      


