# Workflow name displayed in GitHub Actions
name: PETGEM CI

# Events that trigger this workflow
on:
  push:
    branches:
      - develop  # Trigger CI on pushes to 'develop' branch
  pull_request:
    branches:
      - develop  # Trigger CI on PRs targeting 'develop'

# Global environment variables accessible by all jobs
env:
  PETSC_DIR: /usr/local/petsc             # PETSc installation directory
  PETSC_ARCH: arch-linux-c-opt            # PETSc architecture/config
  GMSH_DIR: /usr/local/gmsh/bin           # GMSH executable directory
  PETGEM_TEST_DIR: tests/canonical_model  # Directory with PETGEM test models

# === JOB: docker-build ===
# Build and push the Docker image for the CI environment
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Setup QEMU for cross-platform Docker builds
      - uses: docker/setup-qemu-action@v3

      # Setup Docker Buildx for advanced caching and multi-platform builds
      - uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image, capture logs
      - name: Build & Push Docker image
        run: |
          echo "### Starting Docker build for PETGEM CI image" | tee docker_build.log
          docker buildx build \
            --file ./docker/Dockerfile \
            --tag ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --push \
            . 2>&1 | tee -a docker_build.log
          if [ $? -eq 0 ]; then
            echo "✅ Docker image built and pushed successfully" | tee -a docker_build.log
          else
            echo "❌ Docker build failed" | tee -a docker_build.log
          fi

      # Upload Docker build log for later use in CI report
      - name: Upload Docker build log
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-logs
          path: docker_build.log

# === JOB: compile-petgem ===
# Compile the PETGEM code using the Docker image
  compile-petgem:
    runs-on: ubuntu-latest
    needs: docker-build  # Wait for Docker image build to complete
    steps:
      - uses: actions/checkout@v4

      # Pull the CI Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      # Compile PETGEM inside Docker and capture log
      - name: Compile PETGEM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            make USE_EXTRAE=0 2>&1 | tee compile_petgem.log
          if [ $? -eq 0 ]; then
            echo "✅ PETGEM compiled successfully" | tee -a compile_petgem.log
          else
            echo "❌ PETGEM compilation failed" | tee -a compile_petgem.log
          fi

      # Upload compilation log
      - uses: actions/upload-artifact@v4
        with:
          name: compile-logs
          path: compile_petgem.log

# === JOB: compile-docs ===
# Generate project documentation and badge inside Docker
  compile-docs:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      # Pull Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      # Generate docs and coverage badge
      - name: Generate documentation and badge
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "make docs && \
                     python3 ./scripts/coverage_doc/coverage_doc.py ./docs/doxygen/xml/ --badge --badge_path ./docs/doc_coverage_badge.svg" 2>&1 | tee docs.log
          if [ $? -eq 0 ]; then
            echo "✅ Documentation generated successfully" | tee -a docs.log
          else
            echo "❌ Documentation generation failed" | tee -a docs.log
          fi
          mkdir -p ci-reports
          mv ./docs/doc_coverage_badge.svg ./ci-reports/

      # Upload documentation log
      - uses: actions/upload-artifact@v4
        with:
          name: docs-logs
          path: docs.log

# === JOB: test-petgem ===
# Run PETGEM test preprocessing scripts inside Docker
  test-petgem:
    runs-on: ubuntu-latest
    needs: compile-petgem
    steps:
      - uses: actions/checkout@v4

      # Pull Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      # Run test preprocessing and capture log
      - name: Run PETGEM tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "gmsh ${PETGEM_TEST_DIR}/mesh.geo -3 && \
                     python3 ${PETGEM_TEST_DIR}/generate_resistivity_model.py && \
                     python3 ${PETGEM_TEST_DIR}/generate_params_file.py" 2>&1 | tee test_petgem.log
          if [ $? -eq 0 ]; then
            echo "✅ PETGEM test preprocessing completed" | tee -a test_petgem.log
          else
            echo "❌ PETGEM test preprocessing failed" | tee -a test_petgem.log
          fi

      # Upload test logs
      - uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_petgem.log

# === JOB: ci-report ===
# Collect logs from all jobs, generate Markdown, HTML/PDF reports, and deploy
  ci-report:
    runs-on: ubuntu-latest
    needs: [docker-build, compile-petgem, compile-docs, test-petgem]
    steps:
      - uses: actions/checkout@v4

      # Download logs from all previous jobs
      - name: Download Docker build logs
        uses: actions/download-artifact@v4
        with:
          name: docker-build-logs
          path: ci-logs
      - name: Download compile logs
        uses: actions/download-artifact@v4
        with:
          name: compile-logs
          path: ci-logs
      - name: Download docs logs
        uses: actions/download-artifact@v4
        with:
          name: docs-logs
          path: ci-logs
      - name: Download test logs
        uses: actions/download-artifact@v4
        with:
          name: test-logs
          path: ci-logs

      # Build consolidated Markdown CI report
      - name: Build Markdown CI report
        run: |
          mkdir -p ci-reports
          echo "# PETGEM CI Summary Report" > ci-reports/ci_summary_report.md
          echo "" >> ci-reports/ci_summary_report.md

          # Append Docker build log
          if [ -f ci-logs/docker_build.log ]; then
            echo "## Docker Build Log" >> ci-reports/ci_summary_report.md
            cat ci-logs/docker_build.log >> ci-reports/ci_summary_report.md
            echo "" >> ci-reports/ci_summary_report.md
          fi

          # Append compile log
          if [ -f ci-logs/compile_petgem.log ]; then
            echo "## Compile PETGEM Log" >> ci-reports/ci_summary_report.md
            cat ci-logs/compile_petgem.log >> ci-reports/ci_summary_report.md
            echo "" >> ci-reports/ci_summary_report.md
          fi

          # Append docs log
          if [ -f ci-logs/docs.log ]; then
            echo "## Documentation Log" >> ci-reports/ci_summary_report.md
            cat ci-logs/docs.log >> ci-reports/ci_summary_report.md
            echo "" >> ci-reports/ci_summary_report.md
          fi

          # Append documentation coverage badge
          if [ -f ci-reports/doc_coverage_badge.svg ]; then
            echo "## Documentation Coverage" >> ci-reports/ci_summary_report.md
            echo "![Doc Coverage](doc_coverage_badge.svg)" >> ci-reports/ci_summary_report.md
            echo "" >> ci-reports/ci_summary_report.md
          fi

          # Append test log
          if [ -f ci-logs/test_petgem.log ]; then
            echo "## Test Log" >> ci-reports/ci_summary_report.md
            cat ci-logs/test_petgem.log >> ci-reports/ci_summary_report.md
            echo "" >> ci-reports/ci_summary_report.md
          fi

          echo "---" >> ci-reports/ci_summary_report.md
          echo "🎉 CI workflow completed at $(date)" >> ci-reports/ci_summary_report.md

      # Convert Markdown report to HTML and PDF
      - name: Convert Markdown to HTML/PDF
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc wkhtmltopdf
          pandoc ci-reports/ci_summary_report.md -o ci-reports/ci_summary_report.html
          pandoc ci-reports/ci_summary_report.md -o ci-reports/ci_summary_report.pdf --pdf-engine=wkhtmltopdf

      # Generate simple HTML dashboard
      - name: Generate CI Dashboard
        run: |
          cat > ci-reports/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>PETGEM CI Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; color: #333; }
              h1 { color: #0a5275; }
              ul { line-height: 1.8; }
              a { color: #0a5275; text-decoration: none; font-weight: bold; }
              a:hover { text-decoration: underline; }
              .badge { margin-top: 20px; display: block; }
            </style>
          </head>
          <body>
            <h1>PETGEM CI Reports</h1>
            <ul>
              <li><a href="ci_summary_report.html">📊 CI Summary Report (HTML)</a></li>
              <li><a href="ci_summary_report.pdf">📄 CI Summary Report (PDF)</a></li>
            </ul>

            <!-- Display the documentation coverage badge inline -->
            <div class="badge">
              <h2>Documentation Coverage</h2>
              <img src="doc_coverage_badge.svg" alt="Documentation Coverage Badge">
            </div>
          </body>
          </html>
          EOF

      # Upload CI report artifacts
      - name: Upload CI Report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-execution-report
          path: ci-reports/

      # Deploy reports to GitHub Pages
      - name: Deploy reports to GitHub pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ci-reports
          destination_dir: ci-reports

      # Show dashboard URL in Actions log
      - name: Show GitHub pages URL
        run: |
          echo "✅ CI reports deployed! Access the dashboard at:"
          echo "https://ocastilloreyes.github.io/petgem/ci-reports/"
