# ========================
# Workflow name displayed in GitHub Actions
# ========================
name: PETGEM CI

# ========================
# Events that trigger this workflow
# ========================
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# ========================
# Setup enviroment
# ========================
env:
  PETSC_DIR: /usr/local/petsc
  PETSC_ARCH: arch-linux-c-opt
  GMSH_DIR: /usr/local/gmsh/bin
  EXTRAE_DIR: /usr/local/extrae
  PETGEM_TEST_DIR: tests/canonical_model

jobs:
  # ========================
  # Build Docker image
  # ========================
  docker-build:
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        id: build-image
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        run: echo "image=ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest" >> $GITHUB_OUTPUT

  # ========================
  # Compile PETGEM source
  # ========================
  compile-src:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Compile PETGEM
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e PETSC_DIR=$PETSC_DIR \
            -e PETSC_ARCH=$PETSC_ARCH \
            ${{ needs.docker-build.outputs.image }} \
            make USE_EXTRAE=0

  # ========================
  # Compile documentation
  # ========================
  compile-docs:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Generate documentation and badge
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e PETSC_DIR=$PETSC_DIR \
            -e PETSC_ARCH=$PETSC_ARCH \
            ${{ needs.docker-build.outputs.image }} \
            bash -c "make docs"

  # ========================
  # Run PETGEM tests
  # ========================
  test-csem-kernel:
    runs-on: ubuntu-latest
    needs: compile-src
    steps:
      - uses: actions/checkout@v4

      - name: Run PETGEM tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e PETSC_DIR=$PETSC_DIR \
            -e PETSC_ARCH=$PETSC_ARCH \
            -e GMSH_DIR=$GMSH_DIR \
            ${{ needs.docker-build.outputs.image }} \
            bash -c "gmsh ${PETGEM_TEST_DIR}/mesh.geo -3 && \
                     python3 ${PETGEM_TEST_DIR}/generate_resistivity_model.py && \
                     python3 ${PETGEM_TEST_DIR}/generate_params_file.py"

  # ========================
  # Publish CI report
  # ========================
  publish-report:
    runs-on: ubuntu-latest
    needs: [docker-build, compile-src, compile-docs, test-csem-kernel]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare report folder
        run: mkdir -p ci-report

      - name: Generate CI report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_RUN_ID=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs --jq '.workflow_runs[0].id')
          JOBS_JSON=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$WORKFLOW_RUN_ID/jobs)
          echo "<html><head><title>PETGEM CI Report</title></head><body>" > ci-report/index.html
          echo "<h1>PETGEM CI Report</h1><ul>" >> ci-report/index.html
          echo "$JOBS_JSON" | jq -r '.jobs[] | "<li>\(.name): \(.status) / \(.conclusion)</li>"' >> ci-report/index.html
          echo "</ul></body></html>" >> ci-report/index.html

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ci-report
          publish_branch: gh-pages
          user_name: github-actions
          user_email: github-actions@github.com
          keep_files: false

      - name: Print GitHub Pages URL
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          echo "CI report is available at:"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/index.html"
