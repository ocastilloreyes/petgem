# === Workflow name as it will appear in GitHub Actions UI ===
name: PETGEM CI

# === Trigger conditions for the workflow ===
on:
  push:                   # Run when code is pushed
    branches:             # Only trigger on these branches
      - develop           # Run only for 'develop' branch
  pull_request:           # Also run when a PR is opened or updated
    branches:
      - develop           # Only if the PR targets 'develop'

# === Global environment variables (shared by all jobs) ===
env:
  PETSC_DIR: /usr/local/petsc            # Path to PETSc installation
  PETSC_ARCH: arch-linux-c-opt           # PETSc architecture/configuration
  GMSH_DIR: /usr/local/gmsh/bin          # Path to Gmsh binary directory
  PETGEM_TEST_DIR: tests/canonical_model # Directory for PETGEM test data

# === Jobs definition ===
jobs:
  # === First job: build docker image ===
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # === Second job: compile PETGEM ===
  compile-petgem:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - uses: actions/checkout@v4

      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest

      - name: Compile PETGEM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e PETSC_DIR=$PETSC_DIR \
            -e PETSC_ARCH=$PETSC_ARCH \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            make USE_EXTRAE=0

