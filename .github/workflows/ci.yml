name: PETGEM CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  PETSC_DIR: /usr/local/petsc
  PETSC_ARCH: arch-linux-c-opt
  GMSH_DIR: /usr/local/gmsh/bin
  PETGEM_TEST_DIR: tests/canonical_model

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compile-petgem:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
      - name: Compile PETGEM
        run: |
          echo "### Compile PETGEM" >> ci_summary_report.md
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            make USE_EXTRAE=0 2>&1 | tee compile_petgem.log
          if [ $? -eq 0 ]; then
            echo "✅ PETGEM compiled successfully" >> ci_summary_report.md
          else
            echo "❌ PETGEM compilation failed" >> ci_summary_report.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: compile-logs
          path: compile_petgem.log

  compile-docs:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
      - name: Generate documentation and badge
        run: |
          echo "### Documentation Build" >> ci_summary_report.md
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            -w /app \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "make docs && \
              python3 ./scripts/coverage_doc/coverage_doc.py ./docs/doxygen/xml/ --badge --badge_path ./docs/doc_coverage_badge.svg" 2>&1 | tee docs.log
          mkdir -p ci-reports
          mv ./docs/doc_coverage_badge.svg ./ci-reports/
          if [ $? -eq 0 ]; then
            echo "✅ Documentation generated successfully" >> ci_summary_report.md
          else
            echo "❌ Documentation generation failed" >> ci_summary_report.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: docs-logs
          path: docs.log

  test-petgem:
    runs-on: ubuntu-latest
    needs: compile-petgem
    steps:
      - uses: actions/checkout@v4
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest
      - name: Run PETGEM tests
        run: |
          echo "### PETGEM Tests" >> ci_summary_report.md
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/${{ github.repository_owner }}/petgem-ci-env:latest \
            bash -c "gmsh ${PETGEM_TEST_DIR}/mesh.geo -3 && \
              python3 ${PETGEM_TEST_DIR}/generate_resistivity_model.py && \
              python3 ${PETGEM_TEST_DIR}/generate_params_file.py" 2>&1 | tee test_petgem.log
          if [ $? -eq 0 ]; then
            echo "✅ PETGEM test preprocessing completed" >> ci_summary_report.md
          else
            echo "❌ PETGEM test preprocessing failed" >> ci_summary_report.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_petgem.log

  ci-report:
    runs-on: ubuntu-latest
    needs: [compile-petgem, compile-docs, test-petgem]
    steps:
      - uses: actions/checkout@v4
      - name: Collect reports
        run: |
          mkdir -p ci-reports
          echo "# PETGEM CI Summary Report" > ci-reports/ci_summary_report.md
          echo "" >> ci-reports/ci_summary_report.md

          [ -f compile_petgem.log ] && echo "## Compile PETGEM Log" >> ci-reports/ci_summary_report.md && cat compile_petgem.log >> ci-reports/ci_summary_report.md
          [ -f docs.log ] && echo "## Documentation Log" >> ci-reports/ci_summary_report.md && cat docs.log >> ci-reports/ci_summary_report.md
          [ -f test_petgem.log ] && echo "## Test Log" >> ci-reports/ci_summary_report.md && cat test_petgem.log >> ci-reports/ci_summary_report.md

          echo "" >> ci-reports/ci_summary_report.md
          echo "---" >> ci-reports/ci_summary_report.md
          echo "🎉 CI workflow completed at $(date)" >> ci-reports/ci_summary_report.md
      - name: Convert Markdown to HTML/PDF
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc wkhtmltopdf
          pandoc ci-reports/ci_summary_report.md -o ci-reports/ci_summary_report.html
          pandoc ci-reports/ci_summary_report.md -o ci-reports/ci_summary_report.pdf
      - name: Upload CI Report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-execution-report
          path: ci-reports/
      - name: Deploy reports (badge + CI report) to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ci-reports
          destination_dir: ci-reports
