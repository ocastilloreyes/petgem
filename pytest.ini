[pytest]
# FM-CSEM test suite (unit cube, orders 1..6). See tests/README.md.
#   tests/unit  -> levels 1-3, C harnesses vs the unchanged production sources
#                  (all orders, fast; needs PETSc + mpicc).
#   tests/e2e   -> levels 4-5, the fm.csem binary on examples/unit_cube
#                  (needs the built binary; high orders marked 'slow').
testpaths = tests/unit tests/e2e
python_files = test_*.py
python_functions = test_*

markers =
    e2e: end-to-end fm.csem tests (need the built binary + unit_cube dataset).
        Skipped automatically when the binary is unavailable.
    slow: the full-pipeline e2e family (levels 4-5); heavier on the fixed mesh.

# Default options. Run everything with `pytest`; `pytest tests/unit` (or
# `-m "not slow"`) is the fast levels 1-3 subset covering all orders 1..6.
addopts = -ra --strict-markers
