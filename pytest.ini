[pytest]
# Test discovery
testpaths = tests/unit tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: end-to-end pipeline tests (preprocess → fm.csem → postprocess).
        Skipped automatically when the fm.csem binary is unavailable.
    slow: tests that take more than a few seconds.

# Default options
addopts = -ra --strict-markers
