[pytest]
# PETGEM test suite. See tests/README.md.
#   tests/unit -> C harnesses against the production sources (needs PETSc + mpicc)
#   tests/e2e  -> fm.csem on examples/fm_csem_unit_cube (levels 4-5)
#   tests/mms  -> fm.csem -mms order of accuracy (level 6)
#   tests/mt   -> fm.mt on a half-space
#   tests/tdcsem -> fm.tdcsem on a half-space
# Binary-driven tests skip when their binary or bundle is missing.
testpaths = tests/unit tests/e2e tests/mms tests/mt tests/im tests/tdcsem
python_files = test_*.py
python_functions = test_*

markers =
    e2e: tests that run a kernel binary; skipped when it is unavailable.
    slow: tests that run a kernel binary.

# `pytest -m "not slow"` runs only the C harnesses.
addopts = -ra --strict-markers
