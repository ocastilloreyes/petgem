# .readthedocs.yaml
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen
    - graphviz
  jobs:
    # Doxygen XML + Sphinx API .rst generation. Delegated to the shared
    # script so this stays in lockstep with the Makefile `docs_prep`
    # target (single source of truth - no command duplication to drift).
    pre_build:
      - bash scripts/auto_doc/prepare_docs.sh

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
